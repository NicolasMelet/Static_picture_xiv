<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prog Wipe Lotus</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #16181f; color: #969caa; font: 14px system-ui, sans-serif; }
  img { max-width: calc(100vw - 32px); height: auto; border-radius: 12px; }
  p { text-align: center; }
</style>
</head>
<body>
  <main>
    <img id="prog" src="prog.png" alt="Progression du static Wipe Lotus sur FFLogs">
    <p>Image mise à jour automatiquement depuis FFLogs.</p>
  </main>
  <script>
    // Recharge l'image toutes les 5 minutes sans recharger la page.
    setInterval(() => {
      document.getElementById("prog").src = "prog.png?t=" + Date.now();
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
