name: Build Windows

# - push to main: builds and tests the executable (downloadable from the Actions tab)
# - tag v* (e.g. v1.0.0): builds the executable and publishes a release with ProgFFLogs.exe
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

# A new push cancels the previous build still running on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ProgFFLogs --icon icon.ico
          --add-data "icon.ico;."
          --add-data "config.example.json;."
          --add-data ".env.example;."
          --add-data "images;images"
          prog_tracker.py

      - name: Test the executable
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process dist\ProgFFLogs.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "selftest hung (over 2 min)" }
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:APPDATA\ProgFFLogs\selftest-error.txt" -ErrorAction SilentlyContinue
            throw "selftest failed (code $($p.ExitCode))"
          }
          Get-Content "$env:APPDATA\ProgFFLogs\selftest.txt" -ErrorAction SilentlyContinue
          Write-Host "selftest OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ProgFFLogs
          path: dist/ProgFFLogs.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProgFFLogs.exe
          generate_release_notes: true
